name: Feature request
description: Suggest an API improvement or provider integration
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Describe the use case and the smallest API that would solve it.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What payment integration problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What API or provider behavior do you propose?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What workarounds or designs have you considered?
    validations:
      required: false
